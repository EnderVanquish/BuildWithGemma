<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Argus</title>
  <link rel="stylesheet" href="vendor/daisyui.css">
  <script src="vendor/tailwind-browser.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">
  <header class="navbar bg-base-100/80 backdrop-blur border-b border-white/5 shadow-lg px-6">
    <div class="flex-1 flex items-center gap-2.5">
      <!-- Argus iris-shutter mark. The pupil is masked out rather than filled with the
           surface colour, so the mark sits correctly on the navbar's translucent
           backdrop instead of showing a solid disc slightly off from it. -->
      <svg class="argus-mark" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="argus-iris" gradientUnits="userSpaceOnUse" x1="4" y1="4" x2="28" y2="28">
            <stop offset="0" stop-color="#33b8d9"/>
            <stop offset="1" stop-color="#1e3fe0"/>
          </linearGradient>
          <radialGradient id="argus-shade" cx="0.35" cy="0.3" r="0.75">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="1" stop-color="#000000" stop-opacity="0.22"/>
          </radialGradient>
          <mask id="argus-pupil">
            <rect width="32" height="32" fill="#fff"/>
            <circle cx="16" cy="16" r="4.6" fill="#000"/>
          </mask>
        </defs>
        <g mask="url(#argus-pupil)">
          <path d="M16 16 L28.97 16.91 A13 13 0 0 1 23.27 26.78 Z" fill="url(#argus-iris)"/>
          <path d="M16 16 L21.70 27.68 A13 13 0 0 1 10.30 27.68 Z" fill="url(#argus-iris)"/>
          <path d="M16 16 L8.73 26.78 A13 13 0 0 1 3.03 16.91 Z" fill="url(#argus-iris)"/>
          <path d="M16 16 L3.03 15.09 A13 13 0 0 1 8.73 5.22 Z" fill="url(#argus-iris)"/>
          <path d="M16 16 L10.30 4.32 A13 13 0 0 1 21.70 4.32 Z" fill="url(#argus-iris)"/>
          <path d="M16 16 L23.27 5.22 A13 13 0 0 1 28.97 15.09 Z" fill="url(#argus-iris)"/>
          <circle cx="16" cy="16" r="12.5" fill="url(#argus-shade)"/>
        </g>
      </svg>
      <span class="font-bold text-xl brand-title">Argus</span>
    </div>
    <div class="flex-none flex items-center gap-3">
      <a href="/" class="btn btn-sm btn-primary">Monitor</a>
      <a href="/config.html" class="btn btn-sm btn-ghost">Config</a>
      <span class="sync-dot" id="sync-dot" data-status="synced"
            title="Live — receiving updates from the reasoning loop"></span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 flex flex-col gap-6">
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="card card-rich bg-base-100 shadow-md p-4">
        <div class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-base-content/60 mb-2">
          <svg class="w-3.5 h-3.5 stat-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M4 4a2 2 0 012-2h8a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 1v3h8V5H6zm0 5v1h2v-1H6zm4 0v1h2v-1h-2zm4 0v1h2v-1h-2zm-8 3v1h2v-1H6zm4 0v1h2v-1h-2zm4 0v1h2v-1h-2z"/></svg>
          RAM
        </div>
        <progress class="progress progress-primary w-full mb-2" id="ram-fill" value="0" max="100"></progress>
        <div class="text-sm tabular-nums text-base-content/70" id="ram-value">-- / -- GB</div>
        <div class="text-[10px] uppercase tracking-wide text-base-content/40 mt-1" id="stats-source">&mdash;</div>
      </div>
      <div class="card card-rich bg-base-100 shadow-md p-4">
        <div class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-base-content/60 mb-2">
          <svg class="w-3.5 h-3.5 stat-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 3a1 1 0 00-1 1v1H4a2 2 0 00-2 2v6a2 2 0 002 2h1v1a1 1 0 102 0v-1h6v1a1 1 0 102 0v-1h1a2 2 0 002-2V7a2 2 0 00-2-2h-1V4a1 1 0 10-2 0v1H7V4a1 1 0 00-1-1zM4 7h12v6H4V7z" clip-rule="evenodd"/></svg>
          CPU
        </div>
        <progress class="progress progress-primary w-full mb-2" id="cpu-fill" value="0" max="100"></progress>
        <div class="text-sm tabular-nums text-base-content/70" id="cpu-value">-- %</div>
        <div class="text-[10px] uppercase tracking-wide text-base-content/40 mt-1" id="cpu-cores">&mdash;</div>
      </div>
      <div class="card card-rich bg-base-100 shadow-md p-4 justify-center">
        <div class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-base-content/60 mb-2">
          <svg class="w-3.5 h-3.5 stat-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M3 10a7 7 0 1114 0 7 7 0 01-14 0zm7-4a1 1 0 011 1v3.586l2.207 2.207a1 1 0 01-1.414 1.414l-2.5-2.5A1 1 0 019 12V7a1 1 0 011-1z"/></svg>
          Tokens/sec
        </div>
        <div class="text-2xl font-semibold" id="tokens-value">--</div>
      </div>
      <div class="card card-rich bg-base-100 shadow-md p-4 justify-center">
        <div class="flex items-center gap-1.5 text-xs uppercase tracking-wide text-base-content/60 mb-2">
          <svg class="w-3.5 h-3.5 stat-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v5a1 1 0 00.293.707l3 3a1 1 0 001.414-1.414L11 9.586V5z" clip-rule="evenodd"/></svg>
          Uptime
        </div>
        <div class="text-2xl font-semibold tabular-nums" id="uptime-value">00:00:00</div>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card card-rich bg-base-100 shadow-md p-4 items-center">
        <figure class="w-full frame-glow rounded-lg relative">
          <img id="frame-preview" class="rounded-lg w-full aspect-[4/3] object-cover bg-base-300 hidden" alt="Frame most recently reasoned about">
          <div id="frame-empty"
               class="rounded-lg w-full aspect-[4/3] bg-base-300 flex flex-col items-center justify-center gap-3 text-center px-6">
            <span class="loading loading-ring loading-lg text-primary"></span>
            <span class="text-sm text-base-content/60">Waiting for the first sampled frame&hellip;</span>
          </div>
        </figure>
        <div class="flex items-center gap-3 mt-2">
          <div class="text-sm text-base-content/60 tabular-nums" id="frame-timestamp">--</div>
          <button type="button" id="frame-live-btn" class="btn btn-xs btn-outline btn-primary hidden">
            Back to live
          </button>
        </div>
      </div>

      <div class="flex flex-col gap-4">
        <div class="card card-rich bg-base-100 shadow-md p-4 flex flex-col gap-2">
          <div class="text-xs uppercase tracking-wide text-base-content/60">Current status</div>
          <div class="flex items-center gap-3">
            <span class="status-light" id="status-light" data-level="green"></span>
            <span class="text-lg font-semibold" id="status-word">Waiting&hellip;</span>
            <span class="text-xs tabular-nums text-base-content/50 ml-auto" id="status-time"></span>
          </div>
          <div class="text-sm text-base-content/70 leading-relaxed" id="status-summary">
            Waiting for first observation&hellip;
          </div>
        </div>

        <div class="card card-rich bg-base-100 shadow-md p-4 flex flex-col gap-2" id="selected-card">
          <div class="flex items-center justify-between">
            <div class="text-xs uppercase tracking-wide text-base-content/60">Selected snapshot</div>
            <span class="text-xs tabular-nums text-base-content/50" id="selected-time"></span>
          </div>
          <div id="selected-empty" class="text-sm text-base-content/50 leading-relaxed">
            Click any row in the history below to see the frame and the reasoning behind it.
          </div>
          <div id="selected-body" class="hidden flex-col gap-2">
            <div class="flex items-center gap-3">
              <span class="status-light" id="selected-light" data-level="green"></span>
              <span class="badge severity-badge w-fit" id="selected-severity" data-severity="none">Normal</span>
            </div>
            <div class="text-base font-medium" id="selected-observation"></div>
            <div class="text-sm text-base-content/70 leading-relaxed" id="selected-reasoning"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="card card-rich bg-base-100 shadow-md p-4 flex flex-col gap-3">
      <div class="text-xs uppercase tracking-wide text-base-content/60">Ask about the log</div>
      <form id="ask-form" class="flex gap-2">
        <input type="text" id="ask-input" placeholder="e.g. was anyone at the door after 10pm?"
               class="input input-bordered flex-1" autocomplete="off">
        <button type="submit" id="ask-button" class="btn btn-primary">Ask</button>
      </form>
      <div id="ask-answer" class="text-sm text-base-content/70 leading-relaxed hidden"></div>
    </section>

    <section class="card card-rich bg-base-100 shadow-md p-4">
      <div class="flex items-center justify-between mb-2">
        <div class="text-xs uppercase tracking-wide text-base-content/60">History</div>
        <div class="text-xs text-base-content/60">Severity over time</div>
      </div>
      <svg id="severity-sparkline" viewBox="0 0 400 60" class="w-full h-14 mb-2" preserveAspectRatio="none"></svg>
      <ul class="list" id="history-list"></ul>
    </section>
  </main>

  <script>
    document.documentElement.dataset.theme =
      window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  </script>
  <script src="app.js"></script>
</body>
</html>
